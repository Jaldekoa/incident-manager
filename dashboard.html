<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VoiceOps · Transcripción</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main>
    <header class="topbar">
      <div class="header-actions">
        <button id="clear" class="icon-button" type="button" title="Limpiar sesión" aria-label="Limpiar sesión"><span class="material-symbols-outlined">delete_sweep</span></button>
        <button id="preload" class="outline-button header-button" type="button">Cargar modelo</button>
        <button id="settings" class="icon-button" type="button" title="Configuración" aria-label="Configuración"><span class="material-symbols-outlined">settings</span></button>
      </div>
    </header>

    <section class="panel transcript-panel">
      <div class="section-heading">
        <h2><span class="material-symbols-outlined">record_voice_over</span> Transcripción</h2>
        <div class="heading-actions">
          <button class="text-button icon-action" type="button" data-copy="transcript" title="Copiar transcripción" aria-label="Copiar transcripción"><span class="material-symbols-outlined">content_copy</span></button>
          <button id="capture-toggle" class="record-button" type="button"><span class="record-dot"></span><span>Comenzar captura</span></button>
        </div>
      </div>
      <textarea id="transcript" placeholder="El audio de la pestaña aparecerá aquí…" spellcheck="false" aria-label="Transcripción del cliente"></textarea>
      <div class="model-row">
        <label for="model">Modelo STT</label>
        <select id="model"><option value="">Cargando modelos…</option></select>
      </div>
    </section>
    <section class="panel summary-panel">
      <div class="section-heading">
        <h2><span class="material-symbols-outlined">psychology</span> Resumen</h2>
        <div class="summary-actions">
          <button class="text-button icon-action" type="button" data-copy="summary" title="Copiar resumen" aria-label="Copiar resumen"><span class="material-symbols-outlined">content_copy</span></button>
          <button id="summarize" class="generate-button" type="button"><span class="material-symbols-outlined">wand_stars</span> Generar resumen</button>
        </div>
      </div>
      <textarea id="summary" class="summary" placeholder="Genera un resumen con motivo, síntomas, errores y pasos ya probados…" spellcheck="false" aria-label="Resumen de la llamada"></textarea>
      <div class="model-row summary-model-row">
        <label for="summary-model">Modelo LLM</label>
        <select id="summary-model"><option value="">Cargando modelos…</option></select>
      </div>
    </section>
    <p id="status" class="status-message" role="status" aria-live="polite" hidden></p>

  </main>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
